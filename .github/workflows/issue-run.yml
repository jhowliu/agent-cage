name: Agent Cage issue run

# Label an issue with `agent-cage:run` to have Agent Cage implement it and open
# a PR. Requires these labels to exist and these secrets (see docs/workflow.md):
#   - AGENT_CAGE_GITHUB_TOKEN: a PAT or GitHub App token (NOT the default
#     GITHUB_TOKEN, whose events do not trigger downstream workflows).
#   - CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY:
#     Claude Code auth for the implementation agent.
#   - OPENAI_API_KEY: Codex auth for the review agent.
# The agents are set in .agent-cage.yml; change these secrets with them.
on:
  issues:
    types: [labeled]

# One run per issue; a second label while a run is in flight is queued, not raced.
concurrency:
  group: agent-cage-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: "0.167.0"
  CLAUDE_CODE_VERSION: "2.1.319"

jobs:
  run:
    if: github.event.label.name == 'agent-cage:run'
    runs-on: ubuntu-latest
    env:
      AGENT_CAGE_EXECUTION: direct
      GH_TOKEN: ${{ secrets.AGENT_CAGE_GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark issue in progress
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label 'agent-cage:run' \
            --add-label 'agent-cage:in-progress'

      - name: Check out Agent Cage
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Agent Cage
        run: |
          npm ci
          npm run build

      - name: Install agent CLIs
        run: |
          npm install -g "@openai/codex@${CODEX_CLI_VERSION}" \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Write Agent Cage credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_CAGE_GITHUB_TOKEN: ${{ secrets.AGENT_CAGE_GITHUB_TOKEN }}
        run: |
          { test -n "$CLAUDE_CODE_OAUTH_TOKEN" || test -n "$ANTHROPIC_API_KEY"; } || { printf "Missing CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY\n" >&2; exit 1; }
          test -n "$OPENAI_API_KEY" || { printf "Missing OPENAI_API_KEY\n" >&2; exit 1; }
          umask 077
          {
            if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' "$CLAUDE_CODE_OAUTH_TOKEN"; fi
            if [ -n "$ANTHROPIC_API_KEY" ]; then printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"; fi
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'GITHUB_TOKEN=%s\n' "$AGENT_CAGE_GITHUB_TOKEN"
          } > .agent-cage.env

      - name: Run Agent Cage
        run: node dist/src/cli.js run "$ISSUE_URL" --verbose --result-json "$RUNNER_TEMP/result.json"

      - name: Mark issue ready for review
        if: success()
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label 'agent-cage:ready-for-review'

      - name: Report failure
        if: failure()
        run: |
          FAILURE_CODE=$(jq -r '.failureCode // "unknown"' "$RUNNER_TEMP/result.json" 2>/dev/null || echo unknown)
          BODY="Agent Cage run failed (\`${FAILURE_CODE}\`). [View workflow run](${RUN_URL})."
          SUMMARY_FILE=$(ls .agent-cage/runs/*/summary.md 2>/dev/null | head -n1 || true)
          if [ -n "$SUMMARY_FILE" ]; then
            BODY="${BODY}"$'\n\n'"$(cat "$SUMMARY_FILE")"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label 'agent-cage:blocked'

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cage-run-${{ github.event.issue.number }}
          path: .agent-cage/runs/
          if-no-files-found: ignore

      - name: Clear in-progress label
        if: always()
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label 'agent-cage:in-progress' || true
